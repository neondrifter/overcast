<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="preconnect" href="https://bsky.social">
    <link rel="preconnect" href="https://go.bsky.app">
    <title>Overcast</title>
    <meta name="description" content="Social media as it should be. Find your community among millions of users, unleash your creativity, and have some fun again." />

    <link rel="preload" as="font" type="font/woff2" href="/assets/assets/fonts/inter/InterVariable.woff2" crossorigin>

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/assets/assets/fonts/inter/InterVariable.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/assets/assets/fonts/inter/InterVariable-Italic.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      :root {
        --text: black;
        --background: white;
        --backgroundLight: #e2e7ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --text: white;
          --background: black;
          --backgroundLight: #232e3e;
        }
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      html.theme--light,
      html.theme--light body,
      html.theme--light #root {
        background-color: white;
        --text: black;
        --background: white;
        --backgroundLight: #DCE2EA;
      }
      html.theme--dark,
      html.theme--dark body,
      html.theme--dark #root {
        color-scheme: dark;
        background-color: black;
        --text: white;
        --background: black;
        --backgroundLight: #232E3E;
      }
      html.theme--dim,
      html.theme--dim body,
      html.theme--dim #root {
        color-scheme: dark;
        background-color: #151D28;
        --text: white;
        --background: #151D28;
        --backgroundLight: #2C3A4E;
      }
      #splash {
        display: flex;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        top: -50px;
        width: 100px;
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
    <script>
      const theme = localStorage.getItem('ALF_THEME')
      if (theme) {
        document.documentElement.classList.add(`theme--${theme}`)
      }
    </script>
  </head>

  <body>
    <!--
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <h1 lang="en">Overcast</h1>
          <p lang="en">An umbrella for your social feed.</p>
          <div data-nosnippet>
            <p lang="en">Enable JavaScript to use Overcast.</p>
            <p lang="en" style="margin: 20px 0;">
              <button
                type="submit"
                style="
                  background-color: #2B7AC9;
                  border-radius: 100px;
                  border: none;
                  box-shadow: none;
                  color: #fff;
                  cursor: pointer;
                  font-weight: bold;
                  line-height: 20px;
                  padding: 6px 16px;
                "
              >
                Reload
              </button>
            </p>
          </div>
        </div>
      </form>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="splash">
      <!-- Overcast Umbrella SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 57">
        <path fill="#6BAEE7" d="M32 1.2C33.2 1.2 34.2 2.2 34.2 3.4V5.2H29.8V3.4C29.8 2.2 30.8 1.2 32 1.2ZM36.2 6.2C47.8 7.5 57.5 14.9 61.2 25.4C58.1 23.3 53.9 23.0 50.4 24.8C46.2 15.8 41.5 9.6 36.2 6.2Z"/>
        <path fill="#2B7AC9" fill-rule="evenodd" clip-rule="evenodd" d="M32 6.8C48.8 6.8 62 19.6 62 34.8C62 35.8 61.0 36.5 60.1 36.0C57.6 34.2 54.6 33.4 51.8 33.4C49.0 33.4 46.2 34.3 43.8 36.0C43.1 36.5 42.1 36.5 41.4 36.0C38.8 34.2 35.4 33.4 32 33.4C28.6 33.4 25.2 34.2 22.6 36.0C21.9 36.5 20.9 36.5 20.2 36.0C17.8 34.3 15.0 33.4 12.2 33.4C9.4 33.4 6.4 34.2 3.9 36.0C3.0 36.5 2 35.8 2 34.8C2 19.6 15.2 6.8 32 6.8ZM13.5 25.2C18.8 25.2 23.2 21.4 29.5 21.4C35.8 21.4 40.2 25.2 46.5 25.2H51.2C52.2 25.2 53.0 26.0 53.0 27.0C53.0 28.0 52.2 28.8 51.2 28.8H46.5C39.2 28.8 34.8 25.0 29.5 25.0C24.2 25.0 19.8 28.8 13.5 28.8C12.5 28.8 11.7 28.0 11.7 27.0C11.7 26.0 12.5 25.2 13.5 25.2Z"/>
        <path fill="#5299E5" d="M29.8 33.2H34.2V46.2C34.2 51.5 29.9 55.5 24.6 55.5C19.3 55.5 15.2 51.5 15.2 46.4C15.2 45.2 16.2 44.2 17.4 44.2C18.6 44.2 19.6 45.2 19.6 46.4C19.6 49.1 21.8 51.1 24.6 51.1C27.4 51.1 29.8 49.1 29.8 46.2V33.2ZM41.5 48.2H49.5C50.7 48.2 51.7 49.2 51.7 50.4C51.7 51.6 50.7 52.6 49.5 52.6H41.5C40.3 52.6 39.3 51.6 39.3 50.4C39.3 49.2 40.3 48.2 41.5 48.2Z"/>
      </svg>
    </div>
    <div id="root">
    </div>
  </body>
</html>
